{% extends "base.html" %}
{% block title %}{{ title }} · {{ layout.site_name }}{% endblock %}
{% block content %}
<div class="narrow">
<h1 class="page-title">{{ title }}</h1>
{% for paragraph in paragraphs %}<p>{{ paragraph }}</p>{% endfor %}
{% if let Some((href, text)) = link %}<p><a href="{{ href }}">{{ text }}</a></p>{% endif %}
</div>
{% endblock %}
