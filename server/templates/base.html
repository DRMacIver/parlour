<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ layout.site_name }}{% endblock %}</title>
<link rel="stylesheet" href="/static/parlour.css">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="masthead">
  <div class="wrap">
    <a class="site-name" href="/">{{ layout.site_name }}</a>
  </div>
</header>
<nav class="topnav" aria-label="Main">
  <div class="wrap">
    <a href="/"{% if layout.nav == Nav::Index %} aria-current="page"{% endif %}>Forum index</a>
    <a href="/latest"{% if layout.nav == Nav::Latest %} aria-current="page"{% endif %}>Latest</a>
  </div>
</nav>
<main class="wrap" id="content">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="wrap">Powered by Parlour</div>
</footer>
</body>
</html>
